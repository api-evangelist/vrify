practices:
- area: security program
  claim: >-
    "Our multi-layered security environment follows the principles of least
    privilege, separation of duties, defense in depth, and usability."
  source: https://vrify.com/legal/security
- area: encryption at rest
  claim: >-
    Customer data is stored in AWS cloud databases and Amazon S3 buckets and
    "encrypted at rest using AES-256 encryption through AWS-native encryption
    mechanisms", covering databases, object storage and backups.
  source: https://help.vrify.com/en/articles/11025335-data-security-at-vrify
- area: encryption in transit
  claim: >-
    Not stated on the security page. Observed at the edge: TLS 1.3 with HSTS
    max-age 31536000 on vrify.com, and HSTS with includeSubDomains + preload on
    services.vrify.com.
  source: security/vrify-domain-security.yml
- area: access control
  claim: >-
    "Within the VRIFY cloud environment, access controls are tightly restricted
    to authorized personnel only. All VRIFY employees complete regular security
    training and device compliance checks."
  source: https://help.vrify.com/en/articles/11025335-data-security-at-vrify
- area: model training data
  claim: >-
    Geospatial data used to train VRIFY Predict models is anonymized in four
    stages — data aggregation (company names and project specifications
    stripped), unique numeric asset identifiers replacing names, coordinate
    masking into a normalized index range, and conversion to a numerical image
    matrix that retains no coordinates or project information.
  source: https://help.vrify.com/en/articles/11025335-data-security-at-vrify
- area: authoritative document
  claim: >-
    The help-centre security article explicitly disclaims contractual force; the
    Client Terms of Service is named as the authoritative data-storage agreement.
  source: https://vrify.com/legal/client-terms-of-service

