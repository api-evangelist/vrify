changelog:
  name: VRIFY Release Notes
  hosted_on: help.vrify.com (Intercom help centre, "Release Notes" collection)
  scheme: dated-per-product
  note: >-
    VRIFY does not version an API — it versions products. Release notes are
    published per product line as dated help-centre articles, in four streams:
    DORA / VRIFY Predict, VRIFY Present, VRIFY (platform-wide), and the iOS app.
    The iOS stream is the only one that carries semantic version numbers
    (e.g. 4.7.0); the rest are identified only by date. There is no RSS or JSON
    feed, no per-entry anchor scheme, and no machine-readable changelog.
