aid: vrify
name: VRIFY
description: 'VRIFY Technology Inc. is a Vancouver, British Columbia software company
  that builds exploration intelligence software for the mining industry, with a team
  of geoscientists and AI engineers and a presence in Western Australia. Its platform
  pairs VRIFY Predict — the DORA AI-assisted mineral discovery product, which trains
  mineral-system-specific models on a large proprietary global exploration dataset
  to rank prospectivity targets, score them (VPS) and, since August 2026, quantify
  prediction uncertainty — with VRIFY Present, an interactive 3D and 360-degree presentation
  product mining companies use to communicate projects to investors, plus a Files
  upload/processing and VRIFY Explore data layer and an iOS app. Southern Cross Gold''s
  2024 Sunday Creek discovery came from a target DORA identified independently. VRIFY
  raised a CAD$12.5M Series B in February 2025 led by LGVP with RCF Innovation and
  Beedie Capital, taking total funding past CAD$30M. VRIFY sells a closed end-user
  SaaS: as of August 2026 it publishes no public API, SDK, developer portal or machine-readable
  contract. The only machine surfaces a member of the public can reach are the app''s
  own backend at services.vrify.com/v2/ (401, WWW-Authenticate: Bearer realm="api",
  with its /v2/docs endpoint 302ing to a Django staff login) and a copy-paste 3D presentation
  embed customers place on their own company websites.'
