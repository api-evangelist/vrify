summary: >-
  VRIFY publishes NO first-party /.well-known/ resource on any host. Every
  well-known path on vrify.com, production.vrify.com, develop.vrify.com,
  dora.vrify.com, status.vrify.com and services.vrify.com returns 404. Two hosts
  (admin.vrify.com and dynamic.vrify.com) answer 200 text/html for EVERY
  /.well-known/* path including a nonsense control path — a single-page-app
  catch-all, not a published resource; those 200s are recorded as false positives
  and are NOT credited. The only genuine 200 in the set is a security.txt on
  help.vrify.com, and it is Intercom's boilerplate served by the help-centre
  platform, naming Intercom's Bugcrowd program — it is not VRIFY's, and is not
  credited to VRIFY.
