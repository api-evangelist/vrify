recommendations_for_provider:
- Publish /.well-known/security.txt on vrify.com with a Contact and Policy (RFC 9116).
  The one that exists today belongs to Intercom, not to VRIFY.
- Serve a 404 (not the SPA shell) for unknown /.well-known/* paths on admin.vrify.com
  and dynamic.vrify.com; the catch-all makes automated discovery unreliable against
  those hosts.
